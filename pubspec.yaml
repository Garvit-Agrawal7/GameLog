name: my_game_list
description: "Personal game library app for tracking, logging, and discovering video games"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Database
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking & images
  dio: ^5.4.3
  cached_network_image: ^3.3.1

  # Routing & fonts
  go_router: ^17.3.0
  google_fonts: ^8.1.0

  # UI helpers
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  json_serializable: ^6.7.1
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
